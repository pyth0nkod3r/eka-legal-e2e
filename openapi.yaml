        - BearerAuth: []
      responses:
        '200':
          description: Draft retrieved (null if no draft exists)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/IntakeFormData'
                          - type: 'null'

    post:
      tags:
        - Intake
      summary: Save intake draft
      description: Save intake form progress as a draft
      operationId: saveIntakeDraft
      security:
        - BearerAuth: []
      requestBody:
        required: true
