  # ============================================
  # Intake Form Endpoints
  # ============================================
  /intake:
    post:
      tags:
        - Intake
      summary: Submit intake form
      description: Submit a client intake form to request legal consultation
      operationId: submitIntakeForm
      requestBody:
        required: true
        content:
