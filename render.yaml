services:
  # The Web Service
  - type: web
    name: eka-legal
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard using your Neon PostgreSQL connection string
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "true"
      # Our Dockerfile hardcodes port 8000. We tell Render to expect traffic on 8000.
      - key: PORT
        value: "8000"

